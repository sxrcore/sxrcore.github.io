<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uncrowned Kings</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <img
            id="serverIcon"
            class="server-icon"
            src="https://cdn.discordapp.com/embed/avatars/0.png"
            alt="Server icon"
        >

        <h1 id="serverName">Загрузка...</h1>

        <div id="status" class="status">
            <span class="status-dot"></span>
            <span id="statusText">Проверка сервера...</span>
        </div>

        <div class="stats">

            <div class="stat">
                <span id="members" class="number">—</span>
                <span class="label">Участников</span>
            </div>

            <div class="stat">
                <span id="online" class="number">—</span>
                <span class="label">Онлайн</span>
            </div>

        </div>

        <a
            class="join-button"
            href="https://discord.gg/MMnEpJpXeS"
            target="_blank"
            rel="noopener noreferrer"
        >
            Вступить
        </a>

    </main>

    <script src="script.js"></script>

</body>
</html>
